<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>다시 확인해주세요 · 여백</title><link rel="stylesheet" href="/app.css"></head><body><main class="narrow"><p class="eyebrow" th:text="${status}"></p><h1 th:text="${status == 404 ? '계획을 찾을 수 없어요.' : '요청을 완료하지 못했어요.'}"></h1><p class="muted" th:if="${status == 404}">링크 전체를 복사했는지 확인해주세요.</p><p class="muted" th:if="${status == 403}">수정 키로 다시 열어주세요. 오래 열어둔 화면이라면 작성 내용을 복사해 두고 새로고침해주세요.</p><p class="muted" th:if="${status != 404 and status != 403}">잠시 후 다시 시도해주세요. 입력 중이었다면 뒤로 가서 내용을 복사해 두세요.</p><a href="/" class="button">처음으로</a></main></body></html>
