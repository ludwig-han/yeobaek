<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="panel" id="research" class="card research-panel" th:if="${owner}">
  <h2 th:text="${run != null and run.succeeded ? '핵심 요약' : '계획 조사'}"></h2>
  <p th:if="${!researchAvailable}" class="notice">아직 조사가 활성화되지 않았어요. 계획 저장과 공유는 계속 사용할 수 있어요.</p>
  <p th:if="${researchError}" class="notice error" role="alert" th:text="${researchError}"></p>
  <div th:if="${run != null}">
    <p th:if="${run.running}" class="notice" role="status" data-research-pending>웹에서 확인하고 있어요. 이 화면을 닫아도 조사는 계속됩니다.</p>
    <p th:if="${researchStale}" class="notice error">재조사 필요 · 계획이 수정됐어요. 아래 결과는 수정 전 계획 기준입니다.</p>
    <p th:if="${run.status == 'FAILED'}" class="notice error" role="alert" th:text="${run.errorMessage}"></p>
    <div th:if="${run.succeeded and !report.isEmpty()}">
      <div class="research-overview" th:insert="~{research :: findings('', ${report.summary}, ${report})}"></div>
      <p class="hint" th:if="${#lists.isEmpty(report.summary)}">핵심 목표에 관해 확인된 내용이 없어요. 아래 상세 조사에서 미확인 항목을 살펴보세요.</p>
      <details class="research-details"><summary>상세 조사 보기</summary>
        <div th:replace="~{research :: findings('핵심 목표', ${report.anchors}, ${report})}"></div>
        <div th:replace="~{research :: findings('주의할 점', ${report.risks}, ${report})}"></div>
        <div th:replace="~{research :: findings('방문이 어려울 때의 대안', ${report.backups}, ${report})}"></div>
        <div th:replace="~{research :: findings('중요한 후보', ${report.priorities}, ${report})}"></div>
        <div th:replace="~{research :: findings('아직 확인하지 못한 것', ${report.unknown}, ${report})}"></div>
        <p class="muted fine" th:text="${'조사 시각: ' + run.researchedAt}"></p>
        <details><summary>전체 출처</summary><ol class="source-list"><li th:each="source : ${report.sources}"><a th:href="${source.url}" th:text="${source.title}" target="_blank" rel="noopener noreferrer"></a><span class="source-warning" th:if="${source.old}"> · ⚠ 오래된 정보</span></li></ol></details>
        <details><summary>실제 검색어</summary><ul><li th:each="q : ${report.queries}" th:text="${q}"></li></ul></details>
      </details>
      <iframe th:if="${!#strings.isEmpty(report.searchSuggestions)}" title="Google 검색 제안" class="search-suggestions" sandbox="allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer" th:src="@{/p/{id}/research/suggestions(id=${plan.id})}"></iframe>
    </div>
  </div>
  <p class="hint" th:if="${run == null or !run.succeeded}">목표를 이루는 데 꼭 필요한 운영정보와 주의할 점부터 찾아봐요. 조사 결과와 출발역은 계획자만 봅니다.</p>
  <form class="research-action" method="post" th:action="@{/p/{id}/research(id=${plan.id})}"><button type="submit" data-busy-label="조사 요청 중…" th:disabled="${!researchAvailable or (run != null and run.running)}" th:text="${run != null and run.succeeded ? '다시 조사하기' : '계획 조사하기'}"></button></form>
  <dialog id="source-popup" class="source-popup" aria-label="출처">
    <a data-source-link target="_blank" rel="noopener noreferrer">원문 열기 ↗</a>
    <p class="source-meta" data-source-context hidden></p>
    <button type="button" class="secondary" data-close-source>닫기</button>
  </dialog>
</section>
<section th:fragment="findings(title, items, report)" th:if="${!#lists.isEmpty(items)}">
  <h3 th:if="${!#strings.isEmpty(title)}" th:text="${title}"></h3>
  <article class="research-item" th:each="item : ${items}"><strong th:text="${item.subject}"></strong>
    <span class="research-status" th:if="${item.state != 'SOURCED'}" th:text="${item.state == 'CONFLICT' ? ' · 정보 충돌' : (item.state == 'INFERENCE' ? ' · 추론' : ' · 미확인')}"></span>
    <p class="claim"><th:block th:each="claim : ${item.claims}"><span th:text="${claim.text}"></span><sup th:each="n : ${claim.sourceIds}" th:with="source=${report.sources[n]}"><a class="citation" th:href="${source.url}" th:text="${'[' + (n + 1) + ']'}" th:attr="data-source-title=${source.title},data-source-date=${source.publishedDate},data-source-old=${source.old},aria-label=${'출처 ' + (n + 1) + ' · ' + source.title}" target="_blank" rel="noopener noreferrer"></a><span th:if="${source.old}" class="source-warning" title="오래된 정보">⚠</span></sup></th:block></p>
  </article>
</section>
</body></html>
