<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>계획 수정 · 여백</title><link rel="stylesheet" href="/app.css"></head><body><header class="topbar"><a class="brand" href="/">여백<span>하루 계획</span></a></header><main class="narrow"><h1>내 계획 수정하기</h1><p class="muted">계획을 처음 저장했을 때 받은 수정 키를 입력해주세요.</p><form class="card" method="post" th:action="@{/p/{id}/unlock(id=${plan.id})}"><p th:if="${wrongKey}" class="notice error" role="alert">수정 키가 맞지 않습니다.</p><label for="editKey">수정 키</label><input type="password" name="editKey" id="editKey" minlength="43" maxlength="43" required autocomplete="off"><button type="submit">수정 화면 열기</button></form><a th:href="@{/p/{id}/share(id=${plan.id})}">계획으로 돌아가기</a></main></body></html>
