spring.application.name=yeobaek
server.port=${PORT:8080}
server.servlet.session.timeout=7d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.tomcat.max-http-form-post-size=256KB
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=jdbc:h2:file:./data/yeobaek;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=4
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.thymeleaf.cache=true
spring.web.resources.cache.cachecontrol.no-store=true
spring.mvc.log-request-details=false
research.gemini.api-key=${GEMINI_API_KEY:}
research.gemini.model=${GEMINI_MODEL:}
research.enabled=${RESEARCH_ENABLED:false}
research.daily-limit=${RESEARCH_DAILY_LIMIT:3}
